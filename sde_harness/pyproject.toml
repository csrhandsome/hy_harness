[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "sde-harness"
version = "0.1.0"
description = "Harness VLA agent framework adapted for Hy-VLA and vendored LIBERO"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "hy-vla", "pydantic-ai-slim[anthropic,openai]>=2.1", "pydantic>=2",
    "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27",
    "claude-agent-sdk>=0.1.60", "openai-codex>=0.1.0b3",
    "cursor-sdk>=1.0.0", "codebuddy-agent-sdk>=0.3.0",
    "huggingface-hub>=0.24", "prompt-toolkit>=3.0.48",
    "numpy>=1.24,<2.0", "imageio>=2.0", "scipy>=1.11",
    "robosuite==1.4.1", "mujoco==2.3.7", "bddl==1.0.1",
    "easydict>=1.9", "cloudpickle>=2.1", "gym==0.25.2",
    "future>=0.18.2", "pyyaml>=6.0", "wand>=0.6.13", "usd-core>=25.5",
]
[project.scripts]
sde-harness = "rpent.cli.main:main"
rpent = "rpent.cli.main:main"
[tool.setuptools]
include-package-data = true
[tool.setuptools.packages.find]
where = ["."]
include = ["rpent*"]
exclude = ["tests*", "docs*", "scripts*", "robots*", "resources*"]
[tool.uv]
package = true
[tool.uv.sources]
hy-vla = { path = "..", editable = true }
