[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hy-harness-robotwin-sim"
version = "0.1.0"
description = "Isolated RoboTwin 2.0 simulator runtime for Hy-VLA evaluation"
requires-python = ">=3.10,<3.11"
dependencies = [
    # Keep this aligned with ../RoboTwin/script/requirements.txt.
    "torch==2.4.1",
    "torchvision==0.19.1",
    "transforms3d==0.4.2",
    "sapien==3.0.0b1",
    # RoboTwin upstream lists 1.10.1, but embedded sde-harness requires
    # scipy>=1.11. RoboTwin task code uses stable SciPy APIs and is verified
    # against the resolved newer version in this unified simulator+Harness env.
    "scipy>=1.11,<2",
    "mplib==0.2.1",
    "gymnasium==0.29.1",
    "trimesh==4.4.3",
    "open3d==0.18.0",
    "imageio==2.34.2",
    "pydantic",
    "zarr",
    "openai",
    "huggingface-hub==0.25.0",
    "h5py",
    "azure==4.0.0",
    "azure-ai-inference",
    "pyglet<2",
    "wandb",
    "moviepy",
    "termcolor",
    "av",
    "matplotlib",
    "ffmpeg",
    # Required by RoboTwin's official script/_install.sh.
    "pytorch3d @ git+https://github.com/facebookresearch/pytorch3d.git@stable",
    # The source distribution identifies itself as ``nvidia-curobo``.
    "nvidia-curobo @ git+https://github.com/NVlabs/curobo.git@v0.7.8",
    "warp-lang==1.12.0",
    "setuptools==69.5.1",
    # Embedded RoboTwin Harness runs inside the simulator process. Keep its
    # planner/CodeBuddy dependencies in this venv while the root venv owns
    # the GPU action model server.
    "sde-harness",
    "vla-protocol",
]

[tool.uv]
# RoboTwin's official installer uses pip --no-build-isolation for these
# extension packages so that the selected Torch ABI is visible at build time.
no-build-isolation-package = ["pytorch3d", "nvidia-curobo"]

[tool.uv.sources]
sde-harness = { path = "../sde_harness", editable = true }
vla-protocol = { path = "../packages/vla_protocol", editable = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# This directory is an environment manifest plus operational scripts, not a
# Python import package. A tiny explicit selection lets Hatch build the
# editable project metadata required by `uv sync`.
only-include = ["README.md"]